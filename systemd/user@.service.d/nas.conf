# Makes the nextcloud user's session (and its rootless Docker daemon) wait for the NAS share.
# Install: NC_UID=$(id -u nextcloud)
#          sudo install -D -m 644 nas.conf /etc/systemd/system/user@$NC_UID.service.d/nas.conf
#          sudo systemctl daemon-reload
[Unit]
RequiresMountsFor=/home/nextcloud/nextcloud-data
